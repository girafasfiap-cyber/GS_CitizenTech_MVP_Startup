name: CI-CD CitizenTech

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar Tesseract (usado nos testes de leitura de contas)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-por
      - name: Instalar dependências
        run: |
          pip install -r requirements-dev.txt
          pip install pip-audit
      - name: Testes
        run: pytest -q
      - name: Auditoria de dependências (segurança)
        run: pip-audit -r requirements.txt
      - name: Empacotar artefato
        run: zip -r app.zip . -x ".git/*" ".github/*" "tests/*" "infra/*" "README.md" "docs/*.md" "requirements-dev.txt" "pytest.ini"
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.zip

  deploy:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
      - name: Deploy no Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: app.zip
      - name: Smoke test pós-deploy
        run: |
          sleep 90
          curl --fail --silent --show-error --retry 8 --retry-delay 15 "https://${{ secrets.AZURE_APP_NAME }}.azurewebsites.net/health"
